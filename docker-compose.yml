services:
  tower:
    build: .
    volumes:
      - ./benchmarks:/app/benchmarks
      - ./data:/app/data:ro
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=UTC
    command: python experiments/run_all.py
  notebooks:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "8888:8888"
    command: pip install -r requirements.txt && python -m http.server 8000
